version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threattrace_db
    environment:
      POSTGRES_DB: threattrace
      POSTGRES_USER: threattrace_user
      POSTGRES_PASSWORD: threattrace_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threattrace_user -d threattrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threattrace_backend
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=threattrace_super_secret_jwt_key_2026
      - DEMO_ANALYST_EMAIL=analyst.connor@threattrace.soc
      - DEMO_ANALYST_PASSWORD=password123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threattrace_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_DEMO=false
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
